<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Table</title>
<!-- Play from the board (D-175), a developer setting: the board and one player's deck side by side, laid out and
     behaving like a remote player's page (apps/cloud/public/remote.html). Served only on the table PC itself, like the
     board; the deck joins with the table key instead of a join code. -->
<style>
  :root { --felt: #0f2a24; --felt-deep: #0a1d19; --line: #1f4a40; --ink: #f3eee2; --soft: #b9b3a3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--felt-deep); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  html { color-scheme: dark; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--ink); padding: 10px 16px; }
  #play { position: fixed; inset: 0; }
  #board { position: absolute; top: 0; left: 0; width: calc(100% - 412px); height: 100%; border: 0; background: var(--felt-deep); }
  #play.deck-min #board { width: 100%; }
  #deck-wrap { position: absolute; right: 16px; top: 16px; width: 380px; height: min(640px, calc(100% - 32px)); max-height: calc(100% - 32px); display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.55); background: var(--felt-deep); }
  #deck-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--felt); font-size: .85em; color: var(--soft); }
  #deck-bar button { padding: 4px 10px; font-size: .9em; }
  #deck { flex: 1; width: 100%; border: 0; }
  #deck-wrap.min { height: auto; }
  #deck-wrap.in-game:not(.min) { height: calc(100% - 32px) !important; }
  #deck-wrap.min #deck { display: none; }
  @media (max-width: 700px) {
    #board { width: 100%; height: 45%; }
    #play.deck-min #board { height: calc(100% - 44px); }
    #deck-wrap { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 55% !important; border-radius: 16px 16px 0 0; }
    #deck-wrap.min { height: auto !important; }
  }
</style>
</head>
<body>
<div id="play">
  <iframe id="board" title="Game board" src="/board/?in=play" allow="autoplay; fullscreen"></iframe>
  <div id="deck-wrap"><div id="deck-bar"><span>Your deck · played from the board</span><button id="deck-min" type="button">Hide</button></div><iframe id="deck" title="Your deck" src="/deck/?board=1"></iframe></div>
</div>
<script>
(() => {
  "use strict";
  // The deck joins with this key (the table's own PC only; this page is served like the board).
  window.TABLE_KEY = "__TABLE_KEY__";
  const $ = (id) => document.getElementById(id);

  // Back to the board alone when the setting is switched off (the board inside says so).
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.source !== $("board").contentWindow) return;
    if (e.data && e.data.type === "gt-board-deck" && e.data.on === false) location.replace("/board/");
  });

  $("deck-min").addEventListener("click", () => {
    const w = $("deck-wrap");
    w.classList.toggle("min");
    $("play").classList.toggle("deck-min", w.classList.contains("min"));
    $("deck-min").textContent = w.classList.contains("min") ? "Show" : "Hide";
    fitDeck();
  });

  // The deck window takes the height of its content (as on the remote page, D-095); during a game the full height (D-131).
  let fitQueued = false;
  function fitDeck() {
    const wrap = $("deck-wrap");
    if (wrap.classList.contains("min")) return void (wrap.style.height = "");
    let doc;
    try { doc = $("deck").contentDocument; } catch { return; }
    const app = doc && doc.getElementById("app");
    if (!app || !app.lastElementChild) return;
    const inGame = !!doc.getElementById("tab-table");
    wrap.classList.toggle("in-game", inGame);
    if (inGame) return void (wrap.style.height = "");
    const win = doc.defaultView;
    const bottom = Math.max(0, ...[...app.children].filter((el) => el.getClientRects().length).map((el) => el.getBoundingClientRect().bottom)) + win.scrollY;
    const pad = parseFloat(win.getComputedStyle(app).paddingBottom) || 0;
    const footer = doc.querySelector("footer");
    const content = Math.ceil(bottom + pad + (footer ? footer.offsetHeight : 0));
    wrap.style.height = `${content + $("deck-bar").offsetHeight + 2}px`;
  }
  function fitDeckSoon() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fitDeck(); });
  }
  $("deck").addEventListener("load", () => {
    let doc;
    try { doc = $("deck").contentDocument; } catch { return; }
    const app = doc && doc.getElementById("app");
    if (!app) return;
    new MutationObserver(fitDeckSoon).observe(app, { childList: true, subtree: true, characterData: true, attributes: true });
    if (doc.fonts) doc.fonts.ready.then(fitDeckSoon);
    fitDeckSoon();
  });
  window.addEventListener("resize", fitDeckSoon);
})();
</script>
</body>
</html>
