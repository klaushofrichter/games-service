<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Table</title>
  <link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/board/board.css">
  <script>window.TABLE_KEY = "__TABLE_KEY__";</script>
</head>
<body>
  <!-- The board renders at 1920 × 1080 logical pixels and scales to the screen. -->
  <div id="stage">
    <div id="surface">
      <div id="seats"></div>
      <div id="center"></div>
      <div id="game-layer" hidden></div>
      <div id="pause-layer" hidden></div>
      <!-- Corner buttons turn the lobby toward an edge: upper-left north, upper-right east, lower-right south, lower-left west. -->
      <div id="corners" hidden></div>
      <button id="lobby-button" hidden aria-label="Open lobby">☰ Lobby</button>
      <!-- When a game ends, its last screen stays until someone taps this (D-091). -->
      <button id="result-button" class="primary" hidden>Show result ›</button>
      <!-- Settings (D-088): beside the corner at the left end of the edge the board faces. -->
      <button id="settings-button" hidden aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M10.3 2.6h3.4l.5 2.6a7.4 7.4 0 0 1 1.9 1.1l2.5-.9 1.7 2.9-2 1.7a7.4 7.4 0 0 1 0 2.2l2 1.7-1.7 2.9-2.5-.9a7.4 7.4 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.4 7.4 0 0 1-1.9-1.1l-2.5.9-1.7-2.9 2-1.7a7.4 7.4 0 0 1 0-2.2l-2-1.7 1.7-2.9 2.5.9a7.4 7.4 0 0 1 1.9-1.1z"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.9"/></svg></button>
    </div>
  </div>
  <div id="overlay-root"></div>
  <script type="module" src="/board/board.js"></script>
</body>
</html>
