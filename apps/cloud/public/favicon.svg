  <rect x="16" y="16" width="32" height="32" rx="6" fill="#f3eee2"/>
  <circle cx="24" cy="24" r="4.5" fill="#0a1d19"/>
  <circle cx="32" cy="32" r="4.5" fill="#0a1d19"/>
  <circle cx="40" cy="40" r="4.5" fill="#d2574a"/>
</svg>
