# Table Host on the table PC. Host networking, so phones on the venue WiFi reach it directly
# and the kiosk browser on the same machine reaches the board over loopback. The health check comes
# from the image (deploy/table-host.Dockerfile).
services:
  table-host:
    image: ghcr.io/klaushofrichter/games-table-host:${VERSION:-latest}
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - /var/lib/gametable:/data
