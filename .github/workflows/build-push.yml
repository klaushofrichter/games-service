# Push to main: re-run the tests, then build and push both images as `:main` — and nothing else.
# `main` is continuously built but never deployed. This workflow is the only writer of `:main`; the deploy workflow
# alone writes `:<sha>`, `:v<version>` and `:latest` (one writer per tag, the cluster's convention for a new service).
name: Build main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [cloud, table-host]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          # A main build reports "main", which tells it apart from a release at a glance.
          build-args: APP_VERSION=main
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/games-${{ matrix.image }}:main
